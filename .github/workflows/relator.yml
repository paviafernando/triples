name: Relator (ElevenLabs)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/voz/**', '.github/workflows/relator.yml']
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Generar frases
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_EN: ${{ vars.VOICE_EN }}
          VOICE_ES: ${{ vars.VOICE_ES }}
          MODEL: ${{ vars.MODEL }}
        run: python tools/voz/elevenlabs.py || echo "falló el script" >> assets/voz/_log.txt
      - name: Guardar
        if: always()
        run: |
          git config user.name "triples-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p assets/voz && git add -A assets/voz || true
          git commit -m "Relator: frases generadas (automático)" || echo "nada nuevo"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
